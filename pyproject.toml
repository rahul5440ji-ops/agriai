[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "agriai"
version = "0.1.0"
description = "AI/ML decision support for Indian farmers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "python-dateutil>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "joblib>=1.4.0",
    "scikit-learn==1.6.0",
    "shap>=0.45.0",
]

[tool.poetry]
packages = [
    { include = "backend" },
    { include = "ml" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
httpx = ">=0.27.0"
pytest-asyncio = ">=0.23.0"
black = ">=24.3.0"
ruff = ">=0.8.0"
mypy = ">=1.10.0"
sqlalchemy = { version = ">=2.0.0", extras = ["asyncio"] }

[tool.poetry.scripts]
agriai = "backend.app:main"
run-tests = "pytest:console_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"